name: CI

# Pull-request and main-branch CI. Runs `npm ci` → `npm run lint` →
# `npm run validate:config` → `npm run check:readme` → `npm test`.
# The two existing workflows (morphe-build.yml and update-patches.yml)
# are dispatch/schedule-only, so this is the only thing that gates a
# broken PR from merging.
#
# Config-change orchestration: when a push to main changes
# `config.json`, the auto-regenerate in `update-patches.yml` lands the
# matching README update as a follow-up commit (PR #43 fix). If CI's
# own `push` trigger ran in parallel, it would check the README on the
# user's commit (which doesn't have the update yet) and fail — a brief
# red run that's later overwritten by a green run on the auto-commit.
#
# Two changes eliminate that race entirely:
#   1. `paths-ignore: ['config.json']` on the `push` trigger — CI does
#      NOT run from `push` when `config.json` is in the diff; the
#      workflow is then picked up by the `workflow_run` listener below.
#   2. `workflow_run` trigger listening for `update-patches.yml`
#      completion on main. It checks out the branch TIP (which already
#      includes the auto-commit when update-patches succeeded) and runs
#      the full check. So CI never sees an out-of-sync README.
#
# `paths-ignore` only excludes pushes where `config.json` changed; pure
# code or docs pushes still go through the normal `push` path. For PRs
# (which don't trigger update-patches), the strict `check:readme` runs
# as usual and forces authors to commit a regen themselves.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'config.json'
  workflow_run:
    workflows: ["Update patches.json from upstream repos"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Cancel any in-flight run for the same ref when a new commit lands.
# PR pushes + main-branch auto-runs are cheap but the test fixture
# build (`zip` install + npm ci + lint + jest suite) is not free —
# cancelling the superseded run keeps the queue moving.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Install zip
        # The apk-selection and apk-abi-validator test fixtures shell
        # out to `zip` to build fake APKs. `unzip` is preinstalled on
        # the runner; `zip` is not — without this step several tests
        # skip with "no zip" warnings instead of actually exercising
        # the path-stripping bug fix.
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate config.json shape
        # Catches typos and missing required keys in patch_repos entries
        # BEFORE merge. Layer A of the "adding a new app must just work"
        # robustness fix — see AGENTS.md / PR #32.
        # PR 3: routes through npm so the ajv-based structural layer
        # (schemas/*.schema.json) runs alongside the hand-rolled
        # semantic rules from .github/scripts/validate-config.js.
        run: npm run validate:config

      - name: Verify README tables match config.json
        # The "Tested apps" and "Releases & Obtainium" tables in README.md
        # are generated from config.json by scripts/generate-readme-tables.js
        # so adding/removing an app is a one-edit affair. This step fails
        # the PR if the README is out of sync — mirrors validate:config
        # and forces a `npm run generate:readme` commit on top of any
        # config.json change.
        run: npm run check:readme

      - name: Test
        run: npm test

  test_workflow_run:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          # The `workflow_run` listener above is filtered to
          # `branches: [main]` (and the job's `if:` also requires
          # `head_repository.full_name == github.repository`), so the
          # completed upstream run is always the same repo on the main
          # branch. A literal `refs/heads/main` checks out that branch
          # tip — equivalent to `head_sha` for a single-branch
          # workflow, and avoids the CodeQL
          # `actions/untrusted-checkout` alert that fires whenever a
          # workflow_run `head_*` field flows into `actions/checkout`'s
          # `ref`.
          ref: refs/heads/main
          persist-credentials: false

      - name: Install zip
        # The apk-selection and apk-abi-validator test fixtures shell
        # out to `zip` to build fake APKs. `unzip` is preinstalled on
        # the runner; `zip` is not — without this step several tests
        # skip with "no zip" warnings instead of actually exercising
        # the path-stripping bug fix.
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate config.json shape
        # Catches typos and missing required keys in patch_repos entries
        # BEFORE merge. Layer A of the "adding a new app must just work"
        # robustness fix — see AGENTS.md / PR #32.
        # PR 3: routes through npm so the ajv-based structural layer
        # (schemas/*.schema.json) runs alongside the hand-rolled
        # semantic rules from .github/scripts/validate-config.js.
        run: npm run validate:config

      - name: Verify README tables match config.json
        # The "Tested apps" and "Releases & Obtainium" tables in README.md
        # are generated from config.json by scripts/generate-readme-tables.js
        # so adding/removing an app is a one-edit affair. This step fails
        # the PR if the README is out of sync — mirrors validate:config
        # and forces a `npm run generate:readme` commit on top of any
        # config.json change.
        run: npm run check:readme

      - name: Test
        run: npm test
