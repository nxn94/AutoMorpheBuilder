name: CI

# Pull-request and main-branch CI. Runs `npm ci` → `npm run lint` →
# `npm run validate:config` → `npm run check:readme` → `npm test`.
# The two existing workflows (morphe-build.yml and update-patches.yml)
# are dispatch/schedule-only, so this is the only thing that gates a
# broken PR from merging.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel any in-flight run for the same ref when a new commit lands.
# PR pushes + main-branch auto-runs are cheap but the test fixture
# build (`zip` install + npm ci + lint + jest suite) is not free —
# cancelling the superseded run keeps the queue moving.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Install zip
        # The apk-selection and apk-abi-validator test fixtures shell
        # out to `zip` to build fake APKs. `unzip` is preinstalled on
        # the runner; `zip` is not — without this step several tests
        # skip with "no zip" warnings instead of actually exercising
        # the path-stripping bug fix.
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate config.json shape
        # Catches typos and missing required keys in patch_repos entries
        # BEFORE merge. Layer A of the "adding a new app must just work"
        # robustness fix — see AGENTS.md / PR #32.
        # PR 3: routes through npm so the ajv-based structural layer
        # (schemas/*.schema.json) runs alongside the hand-rolled
        # semantic rules from .github/scripts/validate-config.js.
        run: npm run validate:config

      - name: Verify README tables match config.json
        # The "Tested apps" and "Releases & Obtainium" tables in README.md
        # are generated from config.json by scripts/generate-readme-tables.js
        # so adding/removing an app is a one-edit affair. This step fails
        # the PR if the README is out of sync — mirrors validate:config
        # and forces a `npm run generate:readme` commit on top of any
        # config.json change.
        run: npm run check:readme

      - name: Test
        run: npm test
