name: CI

# Config-only main pushes are validated after update-patches regenerates README.
# Mixed config/code pushes and PRs must include matching README tables.
on:
  pull_request:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'config.json'
  workflow_run:
    workflows: ["Update patches.json from upstream repos"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout trusted main tip after metadata update
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Never check out workflow_run head data in this privileged event.
          ref: refs/heads/main
          persist-credentials: false

      - name: Install test and lint tools
        # zip builds real APK fixtures; keep missing tools from silently skipping tests.
        run: sudo apt-get update && sudo apt-get install -y zip shellcheck

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check code, tests, configuration and documentation
        run: npm run check

      - name: Validate shell scripts and workflows
        run: |
          shellcheck -x -P SCRIPTDIR .github/scripts/pipeline/*.sh .github/scripts/pipeline/lib/*.sh scripts/*.sh
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
