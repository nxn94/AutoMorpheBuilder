name: CodeQL

# Replaces the repo's "Default setup" so query-pack config lives in
# version control. Default setup is auto-disabled by GitHub as soon
# as this file exists on the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    #  Daily 06:00 UTC — staggered from morphe-build (05:15)
    # to avoid runner contention.
    - cron: '0 6 * * *'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `javascript-typescript` covers both `javascript` and `typescript`
        # analyses — matches what default setup enabled for this repo.
        language: [actions, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
