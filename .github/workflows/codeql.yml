name: CodeQL

# Replaces the repo's "Default setup" so query-pack config lives in
# version control. Default setup is auto-disabled by GitHub as soon
# as this file exists on the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    #  Daily 06:00 UTC — staggered from morphe-build (05:15)
    # to avoid runner contention.
    - cron: '0 6 * * *'

# Workflow-level default. The `analyze` job below declares a
# wider set (`actions: read`, `security-events: write`) per-job.
permissions:
  contents: read

# Cancel any in-flight run for the same ref when a new commit lands.
# CodeQL is heavier than CI (DB build + analysis per language matrix
# entry) so cancelling superseded runs keeps the queue moving.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `javascript-typescript` covers both `javascript` and `typescript`
        # analyses — matches what default setup enabled for this repo.
        language: [actions, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
