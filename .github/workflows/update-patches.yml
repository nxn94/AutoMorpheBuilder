name: Update patches.json from upstream repos

on:
  # Auto-run when config.json adds a patch repo not yet present in
  # patches.json (Layer C of "adding a new app must just work"). The
  # `detect-new-repos` step early-exits when there's nothing to sync, so
  # this push trigger is cheap on no-op commits. Manual dispatch still
  # available below for a full re-sync.
  push:
    branches: [main]
    paths:
      - 'config.json'
      - '.github/scripts/pipeline/sync-patches.sh'
      - '.github/scripts/pipeline/resolve-tag.sh'
  workflow_dispatch:

# Belt-and-braces guard: the `push:` trigger above is constrained to
# `branches: [main]` so PR exposure is already impossible, but if
# someone loosens the filter later the explicit `if` enforces the
# no-PR-runs intent and surfaces it in the workflow editor.

# Workflow-level default. The `update-patches` job below needs to
# commit + push to main, so it declares `contents: write` per-job.
permissions:
  contents: write

# Shared concurrency group with morphe-build.yml's create-release step:
# both push to main (patches.json here, config.json + release tags
# there). Serializing them prevents a manual update-patches run from
# racing against a scheduled build's release push.
concurrency:
  group: morphe-writes-to-main
  cancel-in-progress: false

jobs:
  update-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Detect new patch repos in config.json
        id: detect
        if: github.event_name == 'push'
        env:
          CONFIG_FILE: config.json
          PATCHES_FILE: patches.json
        run: node scripts/detect-new-repos.js

      - name: Sync patches.json (skip if no new repos on auto-trigger)
        if: github.event_name == 'workflow_dispatch' || steps.detect.outputs.has_new_repos == 'true'
        env:
          CONFIG_FILE: config.json
          PATCHES_FILE: patches.json
        run: bash scripts/sync-patches.sh

      - name: Regenerate README tables from config.json
        # Same trigger as the sync step above: only on push to main
        # (workflow_dispatch skips this because the operator may have
        # staged a manual commit already). Keeps the "Tested apps" and
        # "Releases & Obtainium" tables in sync with patch_repos — adding
        # or removing an app in config.json auto-updates both files in
        # the same commit.
        if: github.event_name == 'push'
        run: node scripts/generate-readme-tables.js

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add patches.json README.md
          if git diff --cached --quiet; then
            echo "::notice::No file changes; nothing to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -qx README.md \
              && git diff --cached --name-only | grep -qx patches.json; then
            COMMIT_MSG="chore: sync patches and README tables from config.json"
          elif git diff --cached --name-only | grep -qx README.md; then
            COMMIT_MSG="chore: regenerate README tables from config.json"
          else
            COMMIT_MSG="chore: sync patches from upstream repos"
          fi
          git commit -m "$COMMIT_MSG"
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${BRANCH_NAME}"
          echo "::notice::Committed and pushed: $(git diff --cached --name-only | tr '\n' ' ')"
