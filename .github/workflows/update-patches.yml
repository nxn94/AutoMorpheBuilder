name: Update patches.json from upstream repos

on:
  # Auto-run when config.json adds a patch repo not yet present in
  # patches.json (Layer C of "adding a new app must just work"). The
  # `detect-new-repos` step early-exits when there's nothing to sync, so
  # this push trigger is cheap on no-op commits. Manual dispatch still
  # available below for a full re-sync.
  push:
    branches: [main]
    paths:
      - 'config.json'
      - '.github/scripts/pipeline/sync-patches.sh'
      - '.github/scripts/pipeline/resolve-tag.sh'
  workflow_dispatch:

permissions:
  contents: write

# Shared concurrency group with morphe-build.yml's create-release step:
# both push to main (patches.json here, config.json + release tags
# there). Serializing them prevents a manual update-patches run from
# racing against a scheduled build's release push.
concurrency:
  group: morphe-writes-to-main
  cancel-in-progress: false

jobs:
  update-patches:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Detect new patch repos in config.json
        # When triggered by `push` (auto-seed), early-exit if
        # config.json doesn't add a patch repo that isn't already in
        # patches.json. Saves a full sync on no-op commits and makes
        # the auto-seed path visible in the workflow summary.
        id: detect
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          new_repos="$(comm -23 \
            <(jq -r '.patch_repos | to_entries[] | .value.repo' config.json | sort -u) \
            <(jq -r 'keys[]' patches.json | sort -u))"

          if [ -z "$new_repos" ]; then
            echo "has_new_repos=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No new patch repos in config.json; skipping sync."
            exit 0
          fi

          echo "has_new_repos=true" >> "$GITHUB_OUTPUT"
          echo "New patch repos to seed:"
          # Use a here-string + while-read so multi-repo additions
          # render one bullet per repo instead of one bullet per
          # whitespace-separated word (which `printf '  - %s\n'
          # $new_repos` would do without quoting).
          while IFS= read -r repo; do
            echo "  - ${repo}"
          done <<< "$new_repos"

      - name: Sync patches.json (skip if no new repos on auto-trigger)
        if: github.event_name == 'workflow_dispatch' || steps.detect.outputs.has_new_repos == 'true'
        run: |
          set -euo pipefail

          # Validate required config keys
          if ! jq -e '.patch_repos | type == "object" and length > 0' config.json >/dev/null 2>&1; then
            echo "::error::config.json is missing or empty 'patch_repos'. Add per-app repo assignments."
            exit 1
          fi
          if ! jq -e '.cli | has("repo") and has("branch")' config.json >/dev/null 2>&1; then
            echo "::error::config.json is missing 'cli.repo' or 'cli.branch'."
            exit 1
          fi

          # Resolve branch → tag. Same logic as morphe-build.yml.
          source "$GITHUB_WORKSPACE/.github/scripts/pipeline/resolve-tag.sh"

          # Build list of unique repo+branch pairs from config.json
          REPO_PAIRS="$(jq -r '
            .patch_repos
            | to_entries
            | map(.value | "\(.repo)|\(.branch)")
            | unique[]
          ' config.json)"

          # Resolve tag for each unique repo+branch.
          declare -A REPO_TAGS
          while IFS='|' read -r repo branch; do
            echo "Resolving tag for ${repo} (branch=${branch})..."
            tag="$(resolve_release_tag "$repo" "$branch")"
            echo "  -> ${tag}"
            REPO_TAGS["$repo"]="$tag"
          done <<< "$REPO_PAIRS"

          # Pack into the {repo: tag} JSON object the shared sync script expects.
          REPO_VERSIONS="$(
            for repo in "${!REPO_TAGS[@]}"; do
              echo "{\"repo\":\"$repo\",\"tag\":\"${REPO_TAGS[$repo]}\"}"
            done | jq -sc 'map({(.repo): .tag}) | add // {}'
          )"

          REPO_VERSIONS="$REPO_VERSIONS" \
            CONFIG_FILE=./config.json \
            PATCHES_FILE=./patches.json \
            RUNNER_TEMP="$RUNNER_TEMP" \
            bash "$GITHUB_WORKSPACE/.github/scripts/pipeline/sync-patches.sh"

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add patches.json
          if git diff --cached --quiet; then
            echo "::notice::patches.json unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: sync patches from upstream repos"
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${BRANCH_NAME}"
          echo "::notice::Committed and pushed updated patches.json."
