name: Build Morphe-patched apps

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *" # daily at 05:15 UTC

# Belt-and-braces guard: the `on:` block above does not include
# `pull_request`, but if someone adds it later the explicit `if` makes
# the intent (no PR runs) self-documenting and self-enforcing.
if: github.event_name != 'pull_request'

# Workflow-level default. Per-job `permissions:` blocks below override
# this where a job needs more (e.g. create-release needs `contents: write`).
permissions:
  contents: read

# Allow only one in-flight build for this workflow. Concurrent runs would
# race on patches.json / config.json updates; this lets the runner cancel
# the older one instead of producing a corrupt commit.
concurrency:
  group: morphe-build
  cancel-in-progress: false

jobs:
  check-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      # The `filter` step overrides should-build + matrix-include based
      # on whether each app's resolved APK version + patches tag
      # already has a corresponding release. The other outputs come
      # from the `check` step (resolved tags) and are passed through.
      should-build: ${{ steps.filter.outputs.should-build }}
      matrix-include: ${{ steps.filter.outputs.matrix-include }}
      repo-versions: ${{ steps.check.outputs.repo-versions }}
      cli-version: ${{ steps.check.outputs.cli-version }}
      cli-branch: ${{ steps.check.outputs.cli-branch }}
      cli-repo: ${{ steps.check.outputs.cli-repo }}
      skip-list: ${{ steps.filter.outputs.skip-list }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        # PR 3: scripts/validate-config.js is ajv-based (devDep), so we
        # need node + npm available before the validate step. Pinned
        # to the same node-version as the matrix build for consistency.
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        # PR 3: npm ci installs ajv (devDep) used by the validate
        # step below. Gated nowhere — a bad config must fail here
        # before any morphe-desktop or APK download. The later
        # `should-build`-gated npm ci (and node_modules artifact
        # upload) downstream remain for the build matrix; this
        # install is local-only for validation.
        run: npm ci

      - name: Validate configuration
        # PR 3: gates the whole job on a valid config.json + patches.json
        # BEFORE any setup/download cost. ajv validates the structural
        # shape against schemas/*.schema.json; the hand-rolled
        # validateConfig (semantic rules) runs on top. A bad config
        # here fails the workflow in seconds, not 30 minutes into a
        # matrix. Mirrors the same step in ci.yml so PR-time and
        # dispatch-time validation stay in lockstep.
        run: npm run validate:config

      - name: Resolve latest Morphe + CLI versions
        # Emits the optimistic defaults: should-build=true and the FULL
        # matrix. The downstream `filter` step overrides both based on
        # whether every app's release already exists.
        id: check
        run: bash .github/scripts/pipeline/check_versions.sh

      - name: Set up Java (for morphe-desktop)
        # The `filter` and `pre_download_apks` steps both shell out to
        # `java -jar morphe-desktop.jar list-versions`. morphe-desktop
        # 1.12.0 requires Java 21 (default Java on the runner image is
        # older and fails to invoke the jar). The build job sets up
        # Java 21 separately. Runs unconditionally so the filter step
        # can compare against existing releases before any of the
        # expensive Playwright / apkeep / APK pre-download steps fire.
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Preflight per-app patch availability
        # Layer B of "adding a new app must just work". Before
        # downloading any tools or spinning up the build matrix, hit
        # each patch repo's patches-list.json at the resolved tag and
        # confirm the app's package id is in compatiblePackages. Fails
        # fast with a per-app table (in the step summary) so an
        # upstream rename or a typo'd package id surfaces here
        # instead of as a cryptic mid-build "Could not resolve a
        # Morphe-supported version" error 30 minutes later.
        id: preflight
        env:
          CONFIG_FILE: ${{ github.workspace }}/config.json
          REPO_VERSIONS: ${{ steps.check.outputs.repo-versions }}
        run: node .github/scripts/preflight-apps.js

      - name: Download morphe-desktop + patches .mpp
        # Provides the jar + per-repo .mpp files the filter step needs
        # to resolve each app's APK version. Runs unconditionally so the
        # filter step can run before the expensive setup.
        id: tools
        env:
          CLI_REPO: ${{ steps.check.outputs.cli-repo }}
          CLI_TAG: ${{ steps.check.outputs.cli-version }}
          REPO_VERSIONS: ${{ steps.check.outputs.repo-versions }}
        run: bash .github/scripts/pipeline/download_morphe_tools.sh

      - name: Cache patches .mpp
        # See AGENTS.md "Common failures" → "java.lang.NoSuchMethodError" for the full rationale.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            tools/*.mpp
          key: morphe-patches-${{ steps.check.outputs.cli-version }}-repos-${{ hashFiles('config.json') }}

      - name: Compat probe (per-app runtime check)
        # See AGENTS.md "Common failures" → "java.lang.NoSuchMethodError" for the full rationale.
        id: compat
        env:
          CONFIG_FILE: ${{ github.workspace }}/config.json
          REPO_VERSIONS: ${{ steps.check.outputs.repo-versions }}
          TOOLS_DIR: ${{ env.TOOLS_DIR }}
        run: node .github/scripts/compat-probe.js

      - name: Filter matrix by existing releases
        # For every matrix entry, resolve the APK version (pinned or via
        # morphe-desktop list-versions) and check whether
        # <name>-v<apk>-<patches> already exists as a release. Drops
        # those entries from the matrix and emits a skip-list for
        # pre_download_apks.sh. When every entry is already current,
        # should-build flips to false → build + create-release skip.
        # FORCE_BUILD bypasses that check so manual `Run workflow` runs
        # always patch + release, regardless of whether a release for
        # the current tag already exists.
        id: filter
        env:
          REPO_VERSIONS: ${{ steps.check.outputs.repo-versions }}
          TOOLS_DIR: tools
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash .github/scripts/pipeline/check_existing_releases.sh

      - name: Setup Node.js
        if: steps.filter.outputs.should-build == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.filter.outputs.should-build == 'true'
        run: npm ci

      - name: Upload node_modules for build jobs
        # Avoids re-running npm ci in each build matrix entry. The
        # lockfile content is identical for every matrix entry so this
        # is a safe shortcut.
        if: steps.filter.outputs.should-build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: node-modules
          path: node_modules
          retention-days: 1
          if-no-files-found: error

      - name: Cache Playwright browsers
        if: steps.filter.outputs.should-build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-

      - name: Install Playwright browsers
        if: steps.filter.outputs.should-build == 'true'
        env:
          PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST: https://storage.googleapis.com/chrome-for-testing-public
        run: bash .github/scripts/pipeline/install_playwright.sh

      - name: Upload Playwright browsers for build jobs
        if: steps.filter.outputs.should-build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-browsers
          path: ~/.cache/ms-playwright
          retention-days: 1

      - name: Cache apkeep
        id: cache-apkeep
        if: steps.filter.outputs.should-build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: /usr/local/bin/apkeep
          key: apkeep-${{ runner.os }}-v1

      - name: Install apkeep
        if: steps.filter.outputs.should-build == 'true'
        run: bash .github/scripts/pipeline/install_apkeep.sh

      - name: Upload apkeep for build jobs
        if: steps.filter.outputs.should-build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: apkeep-binary
          path: /usr/local/bin/apkeep
          retention-days: 1

      - name: Install aapt for APK version validation
        id: aapt
        if: steps.filter.outputs.should-build == 'true'
        env:
          ANDROID_HOME: /tmp/android-sdk
        run: bash .github/scripts/pipeline/install_aapt.sh

      - name: Pre-download APKs (parallel)
        id: download-apks
        if: steps.filter.outputs.should-build == 'true'
        env:
          REPO_VERSIONS: ${{ steps.check.outputs.repo-versions }}
          SKIP_LIST: ${{ steps.filter.outputs.skip-list }}
          ANDROID_HOME: /tmp/android-sdk
          ANDROID_BUILD_TOOLS_VERSION: ${{ steps.aapt.outputs.ANDROID_BUILD_TOOLS_VERSION }}
        run: bash .github/scripts/pipeline/pre_download_apks.sh

      - name: Upload pre-downloaded APKs
        if: steps.filter.outputs.should-build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pre-downloaded-apks
          path: |
            tools/apks/*.apk
            tools/apks/*.xapk
            tools/apks/*.apkm
            tools/apks/*.apks
          retention-days: 1
          if-no-files-found: ignore

  build:
    needs: check-versions
    if: needs.check-versions.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-versions.outputs.matrix-include) }}

    env:
      GH_TOKEN: ${{ github.token }}
      TOOLS_DIR: tools
      APKS_DIR: apps
      OUT_DIR: out
      PATCH_REPO: ${{ matrix.patchRepo }}
      PATCH_BRANCH: ${{ matrix.patchBranch }}
      PATCH_TAG: ${{ matrix.patchTag }}
      PATCH_SLUG: ${{ matrix.patchSlug }}
      CLI_VERSION: ${{ needs.check-versions.outputs.cli-version }}
      CLI_BRANCH: ${{ needs.check-versions.outputs.cli-branch }}
      CLI_REPO: ${{ needs.check-versions.outputs.cli-repo }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up Java (for morphe-desktop)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify dependencies
        id: deps
        run: |
          for tool in curl jq unzip; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool not found"
              exit 1
            fi
            echo "✓ $tool found: $(command -v "$tool")"
          done

      - name: Install BouncyCastle
        if: steps.cache-bc.outputs.cache-hit != 'true'
        run: bash .github/scripts/pipeline/install_bouncycastle.sh

      - name: Cache BouncyCastle
        id: cache-bc
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: /usr/share/java/bcprov.jar
          key: bouncycastle-bcprov-1.77

      - name: Restore apkeep + Playwright from check-versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: apkeep-binary
          path: /usr/local/bin
        continue-on-error: true

      - name: Restore pre-downloaded APKs from check-versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: pre-downloaded-apks
          # The artifact zip has a `tools/apks/` path prefix (uploaded as
          # `tools/apks/*.apk` from check-versions). Downloading to
          # `$TOOLS_DIR` would extract to `./tools/tools/apks/*` (double
          # prefix) and neither findCachedApk(APKS_DIR) at line 333 nor
          # findCachedApk(TOOLS_DIR) at line 364 would see them.
          # Downloading to `$TOOLS_DIR/apks` strips the prefix and lands
          # the files where download-supported-apk.js expects them.
          path: ${{ env.TOOLS_DIR }}/apks
        continue-on-error: true

      - name: Restore Playwright browsers from check-versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: playwright-browsers
          path: ~/.cache/ms-playwright
        continue-on-error: true

      - name: Prepare build dirs
        run: mkdir -p "$TOOLS_DIR" "$APKS_DIR" "$OUT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'

      - name: Restore node_modules from check-versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: node-modules
          path: node_modules
        continue-on-error: true

      - name: Install Node dependencies (fallback if restore failed)
        run: |
          if [ ! -d node_modules ] || [ ! -d node_modules/playwright ]; then
            echo "::warning::node_modules restore failed; running npm ci as fallback"
            npm ci
          fi

      - name: Install Playwright browsers (fallback if missing)
        env:
          PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST: https://storage.googleapis.com/chrome-for-testing-public
        run: bash .github/scripts/pipeline/install_playwright.sh

      - name: Ensure apkeep is available
        run: |
          # Artifact download strips executable bits; restore them.
          if [ -f /usr/local/bin/apkeep ] && [ ! -x /usr/local/bin/apkeep ]; then
            chmod +x /usr/local/bin/apkeep
          fi
          if ! command -v apkeep >/dev/null 2>&1 || [ ! -x /usr/local/bin/apkeep ]; then
            bash .github/scripts/pipeline/install_apkeep.sh
          fi
          apkeep --version

      - name: Cache patches .mpp
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ${{ env.TOOLS_DIR }}/${{ matrix.patchSlug }}.mpp
          key: morphe-patches-${{ matrix.patchSlug }}-${{ matrix.patchTag }}
          restore-keys: |
            morphe-patches-${{ matrix.patchSlug }}-

      # See AGENTS.md "Common failures" → "java.lang.NoSuchMethodError" for the full rationale.

      - name: Get latest Morphe patches + CLI + APKEditor
        id: morphe
        env:
          PATCH_REPO: ${{ matrix.patchRepo }}
          PATCH_TAG: ${{ matrix.patchTag }}
          PATCH_SLUG: ${{ matrix.patchSlug }}
          CLI_REPO: ${{ env.CLI_REPO }}
          CLI_VERSION: ${{ env.CLI_VERSION }}
          TOOLS_DIR: ${{ env.TOOLS_DIR }}
        run: bash .github/scripts/pipeline/fetch_morphe_tools.sh

      - name: Prepare inputs for download
        id: targetver_prep
        env:
          APP_ID: ${{ matrix.appId }}
          PATCH_REPO: ${{ matrix.patchRepo }}
        run: bash .github/scripts/pipeline/prepare_target_version.sh

      - name: Resolve supported version for ${{ matrix.appId }}
        id: targetver
        env:
          APP_ID: ${{ matrix.appId }}
          PATCH_REPO: ${{ matrix.patchRepo }}
          TOOLS_DIR: ${{ env.TOOLS_DIR }}
          PINNED_VERSION: ${{ steps.targetver_prep.outputs.pinned }}
        run: bash scripts/resolve-target-version.sh

      - name: Cache APK for ${{ matrix.appId }}
        id: cache-apk
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ${{ env.APKS_DIR }}
          key: apk-${{ matrix.appId }}-${{ steps.targetver.outputs.version }}
          restore-keys: apk-${{ matrix.appId }}-

      - name: Install aapt for APK version validation
        id: aapt
        env:
          ANDROID_HOME: /tmp/android-sdk
        run: bash .github/scripts/pipeline/install_aapt.sh

      - name: Download supported APK for ${{ matrix.appId }}
        id: getapk
        env:
          APP_ID: ${{ matrix.appId }}
          TARGET_VERSION: ${{ steps.targetver.outputs.version }}
          TARGET_VERSIONS: ${{ steps.targetver.outputs.versions }}
          APKS_DIR: ${{ env.APKS_DIR }}
          TOOLS_DIR: ${{ env.TOOLS_DIR }}
          APKEDITOR_JAR: ${{ steps.morphe.outputs.apkeditor_jar }}
          PINNED_CHECK: ${{ steps.targetver_prep.outputs.pinned }}
          PATCH_REPO: ${{ matrix.patchRepo }}
          MORPHE_CLI_JAR: ${{ steps.targetver_prep.outputs.jar }}
          MANUAL_URL: ${{ steps.targetver_prep.outputs.url }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/download-supported-apk.js"

      - name: Prepare signing keystore (required)
        id: keystore
        env:
          TOOLS_DIR: ${{ env.TOOLS_DIR }}
          MATRIX_NAME: ${{ matrix.name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/pipeline/prepare_keystore.sh

      - name: Patch ${{ matrix.name }} with morphe-desktop
        id: patch
        env:
          APP_ID: ${{ matrix.appId }}
          APP_NAME: ${{ matrix.name }}
          APK: ${{ steps.getapk.outputs.apk }}
          APK_VERSION: ${{ steps.getapk.outputs.version }}
          PATCH_TAG: ${{ matrix.patchTag }}
          PATCH_REPO: ${{ matrix.patchRepo }}
          PATCH_SLUG: ${{ matrix.patchSlug }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ENTRY_PASS: ${{ secrets.KEY_PASSWORD }}
          TOOLS_DIR: ${{ env.TOOLS_DIR }}
          OUT_DIR: ${{ env.OUT_DIR }}
          APKS_DIR: ${{ env.APKS_DIR }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash .github/scripts/pipeline/patch_apk.sh

      - name: Upload patched ${{ matrix.name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ${{ matrix.name }}-v${{ steps.getapk.outputs.version }}-${{ matrix.patchTag }}
          path: out/${{ steps.patch.outputs.output }}

  create-release:
    needs: [check-versions, build]
    if: needs.build.result == 'success' && needs.check-versions.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Download all patched APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: "*-v*"
          path: apks
          merge-multiple: true

      - name: List downloaded APKs
        run: ls -la apks/

      - name: Publish per-app releases
        env:
          GH_TOKEN: ${{ github.token }}
          APKS_DIR: apks
          CLI_VERSION: ${{ needs.check-versions.outputs.cli-version }}
          CLI_BRANCH: ${{ needs.check-versions.outputs.cli-branch }}
          REPO_VERSIONS: ${{ needs.check-versions.outputs.repo-versions }}
        run: bash .github/scripts/pipeline/create_release.sh

      - name: Prune old releases per app
        # Caps each app's release history at KEEP_COUNT (default 2) by
        # deleting the oldest beyond that window. Runs after publish so
        # the freshly-created/-updated release is always the newest of
        # its app's set. Failures on a single tag (race / already gone)
        # are warnings only; the list call is a hard gate so we never
        # silently skip the cleanup.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/pipeline/prune_old_releases.sh